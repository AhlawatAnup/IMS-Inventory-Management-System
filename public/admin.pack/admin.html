<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title></head><body><div class="ims-container"><aside><nav><a class="active" id="dashboard"><i data-lucide="layout-dashboard" stroke-width="1.5"></i> Dashboard </a><a id="createUserBtn"><i data-lucide="UserPlus" stroke-width="1.5"></i> Create User </a><a id="viewUsersBtn"><i data-lucide="UserPen" stroke-width="1.5"></i> View/Edit Users </a><a id="adminLogoutBtn"><i data-lucide="log-out" stroke-width="1.5"></i> Log out</a></nav></aside><main><div id="defaultDashboard" class="adminDashContent"><div class="header"><h2>Admin Dashboard</h2></div></div><div id="createUserDiv" class="adminDashContent main hidden"><div class="header"><h2>User Registration</h2></div><form id="createUserForm" class="regForm"><div class="ims-input-box"><input type="text" id="username" required="" placeholder=""> <label for="name">username</label></div><div class="ims-input-box"><input type="email" id="email" required="" placeholder=""> <label for="email">email</label></div><div class="ims-input-box"><input type="password" id="password" required="" placeholder=""> <label for="password">password</label></div><div class="ims-input-box"><input type="password" id="confirmPwd" required="" placeholder=""> <label for="confirmPwd">confirm password</label></div><div class="ims-btn-v1"><button id="userSignupBtn"><i data-lucide="UserPlus" stroke-width="1.5"></i> Create User</button></div></form></div><div id="viewUsersDiv" class="adminDashContent main hidden"></div></main></div><dialog id="editUserModal" class="modal"><div class="modal-content"><h3>Edit User Details</h3><form id="editUserForm"><input type="hidden" id="editUserId"><div><label for="editUsername">Username:</label> <input type="text" id="editUsername" required=""></div><div><label for="editEmail">Email:</label> <input type="email" id="editEmail" required=""></div><fieldset><legend>Permissions</legend><label><input type="checkbox" name="permissions" value="read"> Read</label> <label><input type="checkbox" name="permissions" value="write"> Write</label></fieldset><div class="modal-actions"><button type="submit" id="save-user-btn">Update User</button> <button type="button" id="closeModalBtn">Cancel</button></div></form></div></dialog><script src="/packs/admin.packs.js"></script></body></html>
