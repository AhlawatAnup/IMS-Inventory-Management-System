<div class="header">
  <h2>User Registration</h2>
</div>
<form id="createUserForm" class="regForm">
  <div class="ims-input-box">
    <input type="text" id="username" required placeholder="" />
    <label for="name">username</label>
  </div>

  <div class="ims-input-box">
    <input type="email" id="email" required placeholder="" />
    <label for="email">email</label>
  </div>

  <div class="ims-input-box">
    <input type="password" id="password" required placeholder="" />
    <label for="password">password</label>
  </div>

  <div class="ims-input-box">
    <input type="password" id="confirmPwd" required placeholder="" />
    <label for="confirmPwd">confirm password</label>
  </div>

  <div class="ims-btn-v1">
    <button id="userSignupBtn">
      <i data-lucide="UserPlus" stroke-width="1.5"></i>
      Create User
    </button>
  </div>
</form>
