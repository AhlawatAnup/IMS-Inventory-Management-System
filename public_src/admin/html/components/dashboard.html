<include src="./aside.html"></include>

<dialog id="editUserModal" class="modal">
  <div class="modal-content">
    <h3>Edit User Details</h3>
    <form id="editUserForm">
      <input type="hidden" id="editUserId" />

      <div>
        <label for="editUsername">Username:</label>
        <input type="text" id="editUsername" required />
      </div>

      <div>
        <label for="editEmail">Email:</label>
        <input type="email" id="editEmail" required />
      </div>

      <fieldset>
        <legend>Permissions</legend>
        <label><input type="checkbox" name="permissions" value="read" /> Read</label>
        <label><input type="checkbox" name="permissions" value="write" /> Write</label>
      </fieldset>

      <div class="modal-actions">
        <button type="submit" id="save-user-btn">Update User</button>
        <button type="button" id="closeModalBtn">Cancel</button>
      </div>
    </form>
  </div>
</dialog>
