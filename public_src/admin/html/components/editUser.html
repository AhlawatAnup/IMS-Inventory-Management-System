<div class="sidePanel hidden" id="editUserSidePanel">
  <form id="editUserForm">
    <div id="formHeader" class="panelHeader">
      <h3>Edit User Details</h3>
      <button id="closeEditOverlayBtn" class="closeOverlayBtn">
        <i data-lucide="X" stroke-width="1.5"></i>
      </button>
    </div>
    <div class="ims-input-box">
      <input type="text" id="editMpn" placeholder="" readonly />
      <label for="editMpn">MPN</label>
    </div>
    <div class="ims-input-box">
      <input type="text" id="editValue" placeholder="" />
      <label for="editValue">Value</label>
    </div>
    <div class="ims-input-box">
      <input type="text" id="editFootprint" placeholder="" />
      <label for="editFootprint">Footprint</label>
    </div>
    <div class="ims-input-box">
      <input type="text" id="editDescription" placeholder="" />
      <label for="editDescription">Description</label>
    </div>
    <div class="ims-input-box">
      <input type="text" id="editQuantity" placeholder="" />
      <label for="editQuantity">Quantity</label>
    </div>
    <div class="ims-input-box">
      <input type="text" id="remarks" placeholder="" />
      <label for="edittingRemarks">Remarks(optional)</label>
    </div>
    <div class="ims-btn-v1">
      <button type="submit" id="editPartSubmit">Update</button>
    </div>
  </form>
</div>
