<div class="sidePanel hidden" id="CsvSidePanel">
  <form id="CSVUploadForm">
    <div id="formHeader" class="panelHeader">
      <h3>Import Components Spreadsheet</h3>
      <button id="closeCSVOverlayBtn" class="closeOverlayBtn">
        <i data-lucide="X" stroke-width="1.5"></i>
      </button>
    </div>
    <div class="ims-input-box">
      <input type="file" id="CSVFileInput" accept=".csv, .xlsx, .xls" required />
      <label for="CSVFile">Select a .csv/.xlsx/.xls file</label>
    </div>
  </form>
</div>
