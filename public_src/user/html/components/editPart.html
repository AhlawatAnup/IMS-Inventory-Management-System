<form id="editPartForm" class="overlayForm userDashContent hidden">
  <div id="formHeader">
    <h3>Edit part details</h3>
    <button id="closeEditOverlayBtn" class="closeOverlayBtn">
      <i data-lucide="X" stroke-width="1.5"></i>
    </button>
  </div>
  <div class="ims-input-box">
    <input type="text" id="editMpn" readonly />
    <label for="editMpn">MPN</label>
  </div>
  <div class="ims-input-box">
    <input type="text" id="editValue" />
    <label for="editValue">Value</label>
  </div>
  <div class="ims-input-box">
    <input type="text" id="editFootprint" />
    <label for="editFootprint">Footprint</label>
  </div>
  <div class="ims-input-box">
    <input type="text" id="editDescription" />
    <label for="editDescription">Description</label>
  </div>
  <div class="ims-input-box">
    <input type="text" id="editQuantity" />
    <label for="editQuantity">Quantity</label>
  </div>
  <div class="ims-btn-v1">
    <button type="submit" id="editPartSubmit">Update</button>
  </div>
</form>
